apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nginx-test
spec:
  type: NodePort                  # exposes the service on every node's IP
  selector:
    app: nginx                    # matches the deployment's pod labels
  ports:
    - port: 80                    # service port inside the cluster
      targetPort: 80              # container port
      nodePort: 30080             # reachable at http://<server-ip>:30080
